# Local development convenience only. NOT auto-merged (only a file literally
# named docker-compose.override.yml would be) — opt in explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# DEPLOYMENT.md requires PostgreSQL to stay unreachable from outside the
# Docker network in production, so this must never be passed on the VPS.
services:
  postgres:
    # Host ports in the 5432 range collide with other local Postgres
    # instances/forwarders on some dev machines; 55432 avoids that.
    ports:
      - '55432:5432'
  api:
    ports:
      - '3000:3000'
