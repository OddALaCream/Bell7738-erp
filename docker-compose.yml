x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

volumes:
  postgres_data:
  documents:
  caddy_data:
  caddy_config:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      APP_DB_ALLOW_CREATEDB: 'false'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: startup-erp-api:${ERP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: 'no'
    init: true
    logging: *logging
    command: ['--migrate']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_MIGRATION_URL:-${DATABASE_URL:?DATABASE_URL is required}}

  seed:
    profiles: ['bootstrap']
    image: startup-erp-api:${ERP_IMAGE_TAG:-local}
    restart: 'no'
    init: true
    logging: *logging
    command: ['--seed']
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_FIRST_NAME: ${OWNER_FIRST_NAME:-Owner}
      OWNER_LAST_NAME: ${OWNER_LAST_NAME:-Account}

  api:
    image: startup-erp-api:${ERP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    logging: *logging
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: '3000'
      APP_BASE_URL: ${APP_BASE_URL}
      WEB_ORIGIN: ${WEB_ORIGIN}
      APP_TIME_ZONE: ${APP_TIME_ZONE}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      REFRESH_TOKEN_HASH_SECRET: ${REFRESH_TOKEN_HASH_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL}
      COOKIE_SECURE: ${COOKIE_SECURE}
      INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS}
      PROJECTS_ENDING_SOON_DAYS: ${PROJECTS_ENDING_SOON_DAYS}
      STORAGE_ROOT: /data/documents
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES}
      DOCUMENT_ALLOWED_EXTENSIONS: ${DOCUMENT_ALLOWED_EXTENSIONS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    volumes:
      - documents:/data/documents
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/health/ready']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-27262976}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
